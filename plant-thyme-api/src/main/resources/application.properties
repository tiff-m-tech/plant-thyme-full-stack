spring.application.name=plant-thyme-api

# Point to .env file at root
spring.config.import=optional:file:plant-thyme-api/.env[.properties]

# Database connection settings
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate DDL auto (create, creat-drop, update)
spring.jpa.hibernate.ddl-auto=update